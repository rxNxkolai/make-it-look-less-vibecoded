<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Make it look less vibecoded">
  <!--
    Favicon cut. The 4x4 mark turns to mush at 16px, so the same idea is reduced to
    a 2x2 grid with one unit gone and displaced. Geometry and colours match mark.svg;
    only the count changes, which is the one thing DESIGN.md allows to scale.
  -->
  <g fill="#5C666B">
    <rect x="6"  y="30" width="20" height="20"/>
    <rect x="32" y="30" width="20" height="20"/>
    <rect x="6"  y="4"  width="20" height="20"/>
  </g>
  <rect x="40" y="6" width="18" height="18" fill="#C4187A"/>
</svg>
