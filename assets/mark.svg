<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 0 184 200" width="184" height="200"
     role="img" aria-labelledby="t d">
  <title id="t">Make it look less vibecoded</title>
  <desc id="d">A four by four grid of grey squares with the top right unit missing. That unit sits outside the grid in magenta, having left the cluster.</desc>
  <!--
    Locked in assets/DESIGN.md. Swiss minimal, 4x4 grid, 24px units, 12px gutter,
    zero radius. Two colours, no gradient, no shadow, no blur.
    Both tones clear 3:1 against white AND against GitHub dark, so this file needs
    no prefers-color-scheme logic and renders correctly on any background.
    Measured: grey 5.89 on white / 3.22 on #0d1117, magenta 5.59 / 3.39.
  -->
  <g fill="#5C666B">
    <rect x="20"  y="56"  width="24" height="24"/>
    <rect x="56"  y="56"  width="24" height="24"/>
    <rect x="92"  y="56"  width="24" height="24"/>

    <rect x="20"  y="92"  width="24" height="24"/>
    <rect x="56"  y="92"  width="24" height="24"/>
    <rect x="92"  y="92"  width="24" height="24"/>
    <rect x="128" y="92"  width="24" height="24"/>

    <rect x="20"  y="128" width="24" height="24"/>
    <rect x="56"  y="128" width="24" height="24"/>
    <rect x="92"  y="128" width="24" height="24"/>
    <rect x="128" y="128" width="24" height="24"/>

    <rect x="20"  y="164" width="24" height="24"/>
    <rect x="56"  y="164" width="24" height="24"/>
    <rect x="92"  y="164" width="24" height="24"/>
    <rect x="128" y="164" width="24" height="24"/>
  </g>
  <!-- the unit that left the cluster -->
  <rect x="156" y="12" width="24" height="24" fill="#C4187A"/>
</svg>
